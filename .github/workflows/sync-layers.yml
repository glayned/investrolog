name: Sync matrix layers

on:
  schedule:
    # Fallback only: GitHub runs schedules hours late. The run is normally started
    # by scripts/sync_trigger.py within minutes of a change in the layers bucket.
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-layers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch and validate the public layer files
        run: python3 scripts/sync_layers.py

      - name: Keep the snapshot of the current trading day
        id: archive
        # A failed snapshot must not hold back the layer files.
        continue-on-error: true
        run: python3 scripts/archive_matrix.py

      - name: Commit changed layer files
        run: |
          git add -A next/layers next/archive
          if git diff --cached --quiet; then
            echo "Layers are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update matrix layers"
          # Another layer workflow may have pushed since the checkout; the files do not overlap.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Report a failed snapshot
        if: steps.archive.outcome == 'failure'
        run: exit 1
