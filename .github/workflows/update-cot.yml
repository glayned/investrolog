name: Update COT strip

on:
  schedule:
    - cron: "17 10 * * 6"
    - cron: "17 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cot
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Update COT data
        if: github.event.schedule != '17 10 * * 0'
        run: python3 scripts/update_cot.py

      - name: Recover missed COT update
        if: github.event.schedule == '17 10 * * 0'
        run: python3 scripts/update_cot.py --skip-if-current

      - name: Rebuild localized pages
        run: python3 scripts/build_locales.py

      - name: Commit new report
        run: |
          if git diff --quiet -- index.html en/index.html; then
            echo "COT data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html
          git commit -m "data: update COT percentiles"
          git push
