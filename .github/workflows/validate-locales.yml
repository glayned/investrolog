name: Validate localized pages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify generated pages and SEO
        run: python3 scripts/build_locales.py --check

      - name: Verify the generated English prototype page
        run: python3 scripts/build_next_locales.py --check

      - name: Test the options layer builder
        run: cd scripts && python3 test_update_matrix_options.py

      - name: Test the layer sync trigger
        run: cd scripts && python3 test_sync_trigger.py

      - name: Test the layer sync
        run: cd scripts && python3 test_sync_layers.py

      - name: Test the matrix archive
        run: cd scripts && python3 test_archive_matrix.py
      - name: Test the matrix page rules
        run: cd scripts && python3 test_matrix_page.py
